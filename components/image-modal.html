<!-- Modal para imágenes -->
<div id="imageModal" class="image-modal">
  <div class="image-modal-content">
    <div class="image-modal-body">
      <div class="image-modal-frame">
        <div class="image-modal-media">
          <button type="button" class="btn-close-circle btn-close-circle--viewport" onclick="event.stopPropagation(); closeImageModal()" aria-label="Cerrar">&times;</button>
          <img id="modalImage" class="image-modal-img" alt="Imagen ampliada">
        </div>
      </div>
      <div id="modalCaption" class="image-modal-caption"></div>
    </div>
  </div>
</div>
